[project]
name = "truth-provenance-wire"
version = "1.0.0"
description = "Autonomous infrastructure deployment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "structlog>=24.1.0",
    
    "fastapi",
    
    "uvicorn",
    
    "pydantic",
    
    "numpy",
    
    "cryptography",
    
    "scikit-learn",
    
    "sentence-transformers",
    
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"